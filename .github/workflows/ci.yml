name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  sizing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: conceptual sizing + CLAIM-1 analysis + A/B comparison (pure python, no deps)
        run: |
          python schemes/kestrel-x1/sizing.py
          python schemes/nova-bwb/sizing.py
          python schemes/kestrel-x1/analysis.py
          python schemes/kestrel-x1/morph.py
          python schemes/kestrel-x1/gust.py
          python schemes/kestrel-x1/econ.py
          python compare.py
      - name: generated evidence exists
        run: |
          test -f docs/comparison.md
          test -f docs/passenger-first.md
          test -f schemes/kestrel-x1/sizing.json
          test -f schemes/nova-bwb/sizing.json
          test -f schemes/kestrel-x1/analysis/wake-filling.json
          test -f schemes/kestrel-x1/analysis/morphing-te.json
          test -f schemes/kestrel-x1/analysis/gust-alleviation.json
          test -f schemes/kestrel-x1/analysis/energy-cost.json
          test -f schemes/kestrel-x1/cfd/results.json
          test -f schemes/kestrel-x1/cfd/drag-polar.json
      - name: CFD evidence schema check (fail-closed)
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open('schemes/kestrel-x1/cfd/drag-polar.json'))
          assert d['tag'].startswith('[M]'), d['tag']
          assert d['mesh']['cells'] == 158783
          assert isinstance(d['runs'], list) and len(d['runs']) == 5
          alphas = sorted(r['alpha_deg'] for r in d['runs'])
          assert alphas == [-2.0, 0.0, 2.0, 4.0, 6.0], alphas
          for r in d['runs']:
              assert 0 < r['Cd_pressure'] < 1 and -1 < r['Cl_pressure'] < 1
          assert 'INVALID' in d['alpha_sweep_validity']
          assert any('UNCONFIRMED' in v for v in [d['design_point']['note']])
          r0 = json.load(open('schemes/kestrel-x1/cfd/results.json'))
          assert r0['patch'] == 'aircraft' and r0['mesh_cells'] == 50873
          assert r0['tag'].startswith('[M]')
          g = json.load(open('schemes/kestrel-x1/analysis/gust-alleviation.json'))
          assert g['claim_id'] == 'CLAIM-3' and g['self_tests']['pass'] is True
          assert len(g['results_per_gust']) == 3
          assert 0 < g['headline']['gust_50fps']['morph_cancel_frac_at_A_max'] <= 1
          e = json.load(open('schemes/kestrel-x1/analysis/energy-cost.json'))
          assert e['claim_id'] == 'ECON-1' and e['self_test']['pass'] is True
          assert e['mission']['breakeven_elec_price_usd_per_kwh'] > 0
          print('cfd + claim evidence schema ok')
          EOF
      - name: generated-evidence freshness gate (fail-closed, exit 2 on stale)
        run: |
          git diff --exit-code -- schemes/kestrel-x1/sizing.json schemes/nova-bwb/sizing.json schemes/kestrel-x1/analysis/wake-filling.json schemes/kestrel-x1/analysis/morphing-te.json schemes/kestrel-x1/analysis/gust-alleviation.json schemes/kestrel-x1/analysis/energy-cost.json docs/comparison.md || { echo "GATE FAIL: committed generated evidence is stale — regenerate locally and commit"; exit 2; }
          echo "freshness gate ok"

  cad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
      - name: install cadquery
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r requirements.txt
      - name: build both scheme models + CFD scaffold
        run: |
          .venv/bin/python schemes/kestrel-x1/model.py
          .venv/bin/python schemes/nova-bwb/model.py
          .venv/bin/python tools/export_mesh.py
      - name: geometry gate — span must be 34-36 m in both models (regression for BUG-2026-11-19-01)
        run: |
          .venv/bin/python -c "
          import json
          for s in ['kestrel-x1', 'nova-bwb']:
              r = json.load(open(f'schemes/{s}/{s}-report.json'))
              assert 34 <= r['bbox_m']['span'] <= 36, (s, r['bbox_m'])
          print('span gate ok')
          "
      - name: artifacts exist
        run: |
          for s in kestrel-x1 nova-bwb; do
            test -f schemes/$s/$s.step
            test -f schemes/$s/view-top.svg
            test -f schemes/$s/cfd/$s-cfd.stl
            test -f schemes/$s/cfd/blockMeshDict
          done
          test -f schemes/kestrel-x1/morph-demo.stl   # CLAIM-2 demo geometry
